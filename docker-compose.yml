version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: exams_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exams_db
      MYSQL_USER: exam
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: exams_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_NAME: exams_db
      DB_USER: exam
      DB_PASSWORD: password
      DB_HOST: mysql
      JWT_SECRET: SECRET
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    command: sh -c "npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all && npm run dev"

  frontend:
    build: ./frontend
    container_name: exams_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
  backend_uploads: